name: Build Container

on:
  workflow_call:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, without the leading v"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-container-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build And Push Container
    runs-on: ubuntu-latest

    steps:
      #
      # Checkout release
      #

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: >-
            ${{ inputs.version != '' &&
                format('v{0}', inputs.version) ||
                github.ref }}
          fetch-depth: 0

      #
      # Determine version
      #

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Could not determine version."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Building container version: ${VERSION}"

      #
      # Validate release tag
      #

      - name: Validate release tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          echo "Validating release tag: ${TAG}"

          git fetch --tags --force

          if ! git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            echo "ERROR: Release tag ${TAG} does not exist."
            echo "The container can only be built from an existing release tag."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"

          echo "Release tag commit:     ${TAG_COMMIT}"
          echo "Checked out commit:     ${CHECKED_OUT_COMMIT}"

          if [ "${TAG_COMMIT}" != "${CHECKED_OUT_COMMIT}" ]; then
            echo "ERROR: Checked out commit does not match release tag ${TAG}."
            exit 1
          fi

          echo "Release tag ${TAG} is valid."
          echo "Building exactly the source associated with ${TAG}."

      #
      # Log in to GitHub Container Registry
      #

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Build and push
      #

      - name: Build and push container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      #
      # Show published image
      #

      - name: Show published image
        shell: bash
        run: |
          echo "Published container:"
          echo "${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          echo "${REGISTRY}/${IMAGE_NAME}:latest"
