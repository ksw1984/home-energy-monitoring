name: Promote Dev To Main

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

env:
  GH_HOST: vwg.ghe.com

jobs:
  validate-release-readiness:
    name: Validate Release Readiness
    runs-on: ubuntu-latest

    outputs:
      release_needed: ${{ steps.validate.outputs.release_needed }}
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry

          python -m poetry config virtualenvs.create false

          python -m poetry install \
            --with dev \
            --no-interaction

      - name: Validate release readiness
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/dev:refs/remotes/origin/dev' \
            '+refs/tags/*:refs/tags/*'

          VERSION="$(
            python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["tool"]["poetry"]["version"])
          PY
          )"

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          echo "Version from pyproject.toml: ${VERSION}"
          echo "Expected tag: ${TAG}"

          #
          # Check whether this version has already been released.
          #

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            echo "No new release requested."

            echo "release_needed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          #
          # Find latest released version on main.
          #

          LATEST_TAG="$(
            git tag \
              --merged origin/main \
              --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 || true
          )"

          echo "Latest release on main: ${LATEST_TAG:-none}"

          #
          # Validate version format and ensure it increased.
          #

          if [ -n "${LATEST_TAG}" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"

            VERSION="${VERSION}" \
            LATEST_VERSION="${LATEST_VERSION}" \
            python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          latest = os.environ["LATEST_VERSION"]

          def parse(value: str) -> tuple[int, int, int]:
              if not re.fullmatch(r"\d+\.\d+\.\d+", value):
                  print(
                      f"ERROR: Unsupported version format: {value}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              return tuple(map(int, value.split(".")))

          current = parse(version)
          previous = parse(latest)

          if current <= previous:
              print(
                  f"ERROR: pyproject.toml version {version} "
                  f"must be greater than latest release {latest}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"Version {version} is greater than latest release {latest}"
          )
          PY
          fi

          #
          # Validate CHANGELOG.
          #

          VERSION="${VERSION}" python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("CHANGELOG.md")

          if not path.exists():
              print(
                  "ERROR: CHANGELOG.md does not exist",
                  file=sys.stderr,
              )
              sys.exit(1)

          changelog = path.read_text(encoding="utf-8")

          pattern = (
              rf"^##\s+v?{re.escape(version)}[^\n]*\n"
              rf"(.*?)(?=^##\s+|\Z)"
          )

          match = re.search(
              pattern,
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )

          if not match:
              print(
                  f"ERROR: No changelog section found for version {version}",
                  file=sys.stderr,
              )
              sys.exit(1)

          section = match.group(1).strip()

          if not section:
              print(
                  f"ERROR: Changelog section for version {version} is empty",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"CHANGELOG.md contains a non-empty section for {version}"
          )
          PY

          echo "release_needed=true" >> "${GITHUB_OUTPUT}"

  create-or-update-promotion-pr:
    name: Create Or Update Dev To Main PR

    runs-on: ubuntu-latest

    needs:
      - validate-release-readiness

    if: needs.validate-release-readiness.outputs.release_needed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}

      - name: Create or update promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          GH_NO_UPDATE_NOTIFIER: 1

          VERSION: ${{ needs.validate-release-readiness.outputs.version }}
          TAG: ${{ needs.validate-release-readiness.outputs.tag }}

        run: |
          set -euo pipefail

          REPO="${GH_HOST}/${GITHUB_REPOSITORY}"

          echo "Repository: ${REPO}"
          echo "GitHub host: ${GH_HOST}"

          gh auth status --hostname "${GH_HOST}"

          #
          # Look for an existing dev -> main PR.
          #

          EXISTING_PR_NUMBER="$(
            gh pr list \
              --repo "${REPO}" \
              --base main \
              --head dev \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="Release ${TAG}: promote dev to main"

          PR_BODY="$(cat <<EOF
          ## Release ${TAG}

          This PR promotes \`dev\` to \`main\` for release.

          **Version:** ${VERSION}
          **Tag:** ${TAG}

          Release-readiness checks have passed:

          - Black
          - Ruff
          - MyPy
          - Pytest
          - CHANGELOG.md validation

          After this PR is merged, the Release Main workflow will:

          1. Create tag \`${TAG}\`
          2. Build the Python wheel
          3. Create the GitHub Release
          4. Attach the wheel to the release

          The main branch is protected and must be updated through this PR.
          EOF
          )"

          if [ -n "${EXISTING_PR_NUMBER}" ]; then
            echo "Existing promotion PR found: #${EXISTING_PR_NUMBER}"

            gh pr edit "${EXISTING_PR_NUMBER}" \
              --repo "${REPO}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"

            echo "Updated promotion PR #${EXISTING_PR_NUMBER}"

          else
            echo "Creating promotion PR..."

            PR_URL="$(
              gh pr create \
                --repo "${REPO}" \
                --base main \
                --head dev \
                --title "${PR_TITLE}" \
                --body "${PR_BODY}"
            )"

            echo "Created promotion PR: ${PR_URL}"
          fi

          echo ""
          echo "The dev -> main promotion PR is ready."
          echo "No automatic merge will be performed."
