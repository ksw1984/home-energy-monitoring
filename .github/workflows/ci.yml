name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Black
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run black --check --diff --fast .


  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run ruff check . --output-format=github


  mypy:
    name: MyPy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run MyPy
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run mypy src


  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    needs:
      - black
      - ruff
      - mypy

    env:
      INFLUXDB_TOKEN: ci-test-token
      LATITUDE: "54.321"
      LONGITUDE: "12.345"
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_ORG: test-org
      INFLUXDB_BUCKET: test-bucket
      FRONIUS_INVERTER_IP: 127.0.0.1
      POWER_METER_GRID_IR_DEVICE0: /dev/null
      POWER_METER_HOUSEHOLD_IR_DEVICE1: /dev/null
      RADEMACHER_SMART_HOME_BOX_IP: 127.0.0.1
      RADEMACHER_UMWELTSENSOR_9475_DEVICE_ID: test-device
      COLLECTION_INTERVAL: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Pytest
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run pytest -vv -ra \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
