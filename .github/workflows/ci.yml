name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  #
  # Build or reuse the CI dependency image first
  #

  prepare-ci-image:
    name: Prepare CI Dependencies Image
    uses: ./.github/workflows/build-ci-image.yml
    secrets: inherit

  #
  # Black
  #

  black:
    name: Black
    runs-on: ubuntu-latest

    needs:
      - prepare-ci-image

    container:
      image: ghcr.io/ksw1984/home-energy-monitoring-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Black
        run: |
          poetry run black --check --diff --fast .

  #
  # Ruff
  #

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    needs:
      - prepare-ci-image

    container:
      image: ghcr.io/ksw1984/home-energy-monitoring-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Ruff
        run: |
          poetry run ruff check . --output-format=github

  #
  # MyPy
  #

  mypy:
    name: MyPy
    runs-on: ubuntu-latest

    needs:
      - prepare-ci-image

    container:
      image: ghcr.io/ksw1984/home-energy-monitoring-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run MyPy
        run: |
          poetry run mypy src

  #
  # Pytest
  #

  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    needs:
      - prepare-ci-image
      - black
      - ruff
      - mypy

    container:
      image: ghcr.io/ksw1984/home-energy-monitoring-ci:latest

    env:
      INFLUXDB_TOKEN: ci-test-token
      LATITUDE: "54.321"
      LONGITUDE: "12.345"
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_ORG: test-org
      INFLUXDB_BUCKET: test-bucket
      FRONIUS_INVERTER_IP: 127.0.0.1
      POWER_METER_GRID_IR_DEVICE0: /dev/null
      POWER_METER_HOUSEHOLD_IR_DEVICE1: /dev/null
      RADEMACHER_SMART_HOME_BOX_IP: 127.0.0.1
      RADEMACHER_UMWELTSENSOR_9475_DEVICE_ID: test-device
      COLLECTION_INTERVAL: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install project
        run: |
          poetry install --only-root --no-interaction

      - name: Run Pytest
        run: |
          poetry run pytest -vv -ra \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
