name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Black
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run black --check --diff --fast .


  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run ruff check . --output-format=github


  mypy:
    name: MyPy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run MyPy
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run mypy src


  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    needs:
      - black
      - ruff
      - mypy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "poetry.lock"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
          python -m poetry install --with dev --no-interaction

      - name: Run Pytest
        shell: bash
        run: |
          set -euo pipefail

          python -m poetry run pytest -vv -ra