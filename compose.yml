services:
  influxdb:
    image: influxdb:2
    container_name: energy-monitoring-influxdb

    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: energy-monitoring-dev
      DOCKER_INFLUXDB_INIT_ORG: home-energy
      DOCKER_INFLUXDB_INIT_BUCKET: energy
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-energy-token

    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config: