# Home Energy Monitoring configuration

collection:
  # Timezone used for all collected measurements.
  timezone: Europe/Berlin


collectors:

  # electricity meter for grid import/export
  # DLMS - faster - 1s intervals no problem
  # interval is a float: 16.7.0 is read every cycle, 1.8.0/2.8.0 hourly.
  # storage_interval: persist every 5th 1s sample; the bus still sees all 5.
  - type: landys_gyr_zmd310_meter_dlms
    enabled: true
    interval: 0.5
    storage_interval: 5
    attributes:
      port: /dev/ttyUSB0
      source: meter_grid_dlms

  # IEC - slower - 6 s intervals max
  - type: landys_gyr_zmd310_meter_iec
    enabled: false
    interval: 10
    attributes:
      port: /dev/ttyUSB0
      source: meter_grid_iec

  # electricity meter for household consumption
  # DLMS - faster - 1s intervals no problem
  # interval is a float: 16.7.0 is read every cycle, 1.8.0/2.8.0 hourly.
  # storage_interval: persist every 5th 1s sample; the bus still sees all 5.
  - type: landys_gyr_zmd310_meter_dlms
    enabled: true
    interval: 0.5
    storage_interval: 5
    attributes:
      port: /dev/ttyUSB1
      source: meter_household_dlms

  # IEC - slower - 6 s intervals max
  - type: landys_gyr_zmd310_meter_iec
    enabled: false
    interval: 10
    attributes:
      port: /dev/ttyUSB1
      source: meter_household_iec

  # Fronius Symo inverter
  - type: fronius
    enabled: true
    interval: 5
    attributes:
      source: inverter_fronius
      inverter_ip: 192.168.178.25
      latitude: 52.4
      longitude: 13.7

  # Rademacher environment sensor
  - type: environment
    enabled: true
    interval: 60
    attributes:
      source: sensor_rademacher
      smart_home_box_ip: 192.168.178.19
      device_id: 50

  # Open-Meteo weather forecast
  - type: weather
    enabled: false
    interval: 3600
    attributes:
      source: online_open_meteo
      latitude: 52.4
      longitude: 13.7

  # Shelly

  # Shelly Plug PM Gen3: SPM01 - SPM02
  - type: shelly_pm
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_pm_washer
      ip: 192.168.178.201

  - type: shelly_pm
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_pm_zendure
      ip: 192.168.178.200

  # Shelly Outdoor Plug S Gen3: SPO03 - SPO04
  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_outdoor_plug_lawnmower
      ip: 192.168.178.203

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_outdoor_plug
      ip: 192.168.178.204

  # Shelly Plug M Gen3: SP-05 - SP-16
  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_refrigirator
      ip: 192.168.178.205

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_dishwasher
      ip: 192.168.178.206

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_zehnder
      ip: 192.168.178.207

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_server
      ip: 192.168.178.208

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_felix
      ip: 192.168.178.209

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_tenways
      ip: 192.168.178.210

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_az_k
      ip: 192.168.178.211

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_az_h
      ip: 192.168.178.212

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp13
      ip: 192.168.178.213

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_dryer
      ip: 192.168.178.214

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp15
      ip: 192.168.178.215

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp16
      ip: 192.168.178.216

databases:
  # InfluxDB instance used to store measurements
  - type: influxdb
    enabled: true
    attributes:
      url: http://influxdb:8086
      org: home-energy
      bucket: home

  - type: text_file
    enabled: true
    attributes:
      directory: ./data/backup

storage:
  enabled: true
  measurements:
    meter_grid_dlms:
      - grid_import_energy_total
      - grid_export_energy_total
      - grid_active_power

    meter_household_dlms:
      - grid_import_energy_total
      - grid_export_energy_total
      - grid_active_power

    inverter_fronius:
      - pv_power
      - pv_energy_day
      - pv_energy_year
      - pv_energy_total
      # - ac_power
      - ac_energy_total
      - mppt_1_energy_total
      - mppt_2_energy_total

    sensor_rademacher:
      - temperature
      - light
      - wind_speed
      - rain_detected

    online_open_meteo:
      current:
        - temperature
        - cloud_cover
        - shortwave_radiation

      forecast:
        - temperature
        - precipitation_probability
        - cloud_cover

    shelly_plug_pm_washer:
      - power

    shelly_plug_m_dryer:
      - power

    shelly_plug_pm_zendure:
      - power
      - energy_total
      - returned_energy_total

    shelly_outdoor_plug_lawnmower:
      - power

    shelly_plug_m_refrigirator:
      - power

    shelly_plug_m_dishwasher:
      - power

    shelly_plug_m_zehnder:
      - power

    shelly_plug_m_server:
      - power

    shelly_plug_m_tenways:
      - power

    shelly_plug_m_az_k:
      - power

    shelly_plug_m_az_h:
      - power

    calculated:
      - inverter_efficiency
      - heat_pump_power
      - household_power_draw

estimators:
  - type: kalman
    enabled: true
    lookback: 1

calculators:
  - type: formula
    enabled: true

    calculations:
      - source: calculated
        metric: heat_pump_power
        unit: kW
        formula: "grid_power - household_power"

        inputs:
          grid_power:
            source: meter_grid_dlms
            metric: grid_active_power
          household_power:
            source: meter_household_dlms
            metric: grid_active_power

      - source: calculated
        metric: household_power_draw
        unit: kW
        formula: "household_power + pv_power*0.001"
        inputs:
          pv_power:
            source: inverter_fronius
            metric: pv_power
          household_power:
            source: meter_household_dlms
            metric: grid_active_power

      - source: calculated
        metric: inverter_efficiency
        unit: "%"
        formula: "ac / (dc1 + dc2) * 100"

        inputs:
          ac:
            source: inverter_fronius
            metric: ac_power
          dc1:
            source: inverter_fronius
            metric: mppt_1_power
          dc2:
            source: inverter_fronius
            metric: mppt_2_power

# Battery Energy Management System. Historical runs are started separately
# with the BEMS command; these entries do not add work to the HEMS poll cycle.
bems:
  enabled: true
  history_database: influxdb

  inputs:
    grid:
      source: meter_grid_dlms
      metric: grid_active_power
    household:
      source: meter_household_dlms
      metric: grid_active_power
    pv:
      source: inverter_fronius
      metric: pv_power

  tariffs:
    feed_in_ct_per_kwh: 7.8
    heat_pump_import_ct_per_kwh: 25.00  #24,06
    household_import_ct_per_kwh: 31.67  #30.47

  control:
    # mqtt: live control from HEMS measurement events; database is for one-shot diagnostics.
    feed: mqtt
    # Optional CSV log of every setpoint sent to an adapter, including mocks.
    # Set to null to disable. The live service appends and flushes each command.
    command_log_csv: data/bems_commands.csv
    deadband_w: 20 # Grid meter deadband after battery compensation; not applied separately to the household meter.
    max_output_power_w: 3500
    # Simulation/replay only: gaps larger than this skip energy integration.
    max_measurement_age_s: 20
    # Live only: request 0 W after this long without a fresh grid sample.
    # 0 W deactivates both charging and feed-in.
    live_max_measurement_age_s: 5
    history_alignment_tolerance_s: 10
    simulation_ramp_seconds: 10
    bems_db_poll_interval_s: 5 # Used only with feed: database; MQTT mode reacts to each new grid message.
    hems_mqtt_publish_interval_s: 0.5 # HEMS publishes grid/household values at most once per interval; BEMS reacts to each grid message.
    # Heat-pump discharge starts only when the energy above the night reserve
    # covers this many seconds at the reference load. Once started it is not
    # re-checked while the heat pump draws; it stops when the reserve is reached.
    # Set 0 to restore the legacy per-cycle reserve cap.
    min_heat_pump_sustain_s: 60.0
    heat_pump_reference_power_w: 2000.0

  night:
    baseline_household_w: 300
    latitude: 52.45
    longitude: 13.75
    timezone: Europe/Berlin
    dusk_margin_minutes: 30
    dawn_margin_minutes: 50          # Reserve ends 50 minutes after sunrise
    baseline_estimation:
      enabled: false                  # true: use measured night baseline instead of the fixed value
      measurement: bems_night_household  # Measurement source for night records in the history database
      safety_factor: 1.15            # Buffer multiplier applied to the measured baseline
      max_age_days: 28               # Maximum age of comparison nights in days
      min_nights: 2                  # Minimum number of valid nights; otherwise use the fallback
      min_valid_ratio: 0.9           # Minimum share of the night that must have valid samples
      max_gap_s: 120                 # Larger gaps between samples invalidate the night
      min_power_w: 100               # Lower plausibility limit for the baseline in watts
      max_power_w: 2000              # Upper plausibility limit for the baseline in watts
      household_meter_includes_battery: true  # Meter includes battery injection: add battery power back
      selection:
        Mon: [ Mon, Tue, Wed, Thu, Fri ]
        Tue: [ Tue, Wed, Thu, Fri, Mon ]
        Wed: [ Wed, Thu, Fri, Mon, Tue ]
        Thu: [ Thu, Fri, Mon, Tue, Wed ]
        Fri: [ Fri, Sat, Sun ]
        Sat: [ Sat, Sun, Fri ]
        Sun: [ Sun, Fri, Sat ]

  profiles:
    zendure_solarflow_4000_mix_ac:
      name: Zendure Solarflow 4000 Mix AC+
      capacity_wh: 8000
      min_soc_percent: 5
      max_soc_percent: 100
      max_charge_power_w: 3000
      max_discharge_power_w: 3000
      charge_efficiency: 0.85057
      discharge_efficiency: 0.9761

    anker_solarbank_max_ac:
      name: Anker SOLIX Solarbank Max AC
      capacity_wh: 7000
      min_soc_percent: 8
      max_soc_percent: 100
      max_charge_power_w: 3000
      max_discharge_power_w: 3000
      charge_efficiency: 0.8235
      discharge_efficiency: 0.9705

    marstek_venus_e_3_5120:
      name: Marstek Venus E 3.0 5.12 kWh
      capacity_wh: 5120
      min_soc_percent: 10
      max_soc_percent: 100
      max_charge_power_w: 2500
      max_discharge_power_w: 2500
      charge_efficiency: 0.8235
      discharge_efficiency: 0.9705

  devices:
    # For a live device, set mode: live and add attributes such as:
    # vendor: anker, host: 192.168.178.x, port: 502, allow_control: true
    # expected_model: A17E2, supported_firmware_versions: ["<exact verified version>"]
    # A missing or unapproved identity keeps all power writes blocked.
    # Enable Modbus TCP for the battery in the Anker app before using it.
    - id: zendure_sim
      profile: zendure_solarflow_4000_mix_ac
      mode: simulation
      enabled: true
      initial_soc_percent: 42.71 #95
      max_output_power_w: 3000

    - id: anker_sim
      profile: anker_solarbank_max_ac
      mode: simulation
      enabled: true
      initial_soc_percent: 42.71 #95
      max_output_power_w: 3000

    - id: marstek_sim
      profile: marstek_venus_e_3_5120
      mode: simulation
      enabled: true
      initial_soc_percent: 95
      max_output_power_w: 800

    # App-hosted dry run: the live controller runs normally, but the battery is
    # in-memory and accepted setpoints are logged to command_log_csv.
    - id: anker_mock
      profile: anker_solarbank_max_ac
      mode: live
      enabled: false
      initial_soc_percent: 50
      max_output_power_w: 800
      attributes:
        mock: true

    - id: zendure_mock
      profile: zendure_solarflow_4000_mix_ac
      mode: live
      enabled: false
      initial_soc_percent: 50
      max_output_power_w: 2000
      attributes:
        mock: true

    # Separate live instances are present but inactive until the hardware is installed.
    - id: zendure_live
      profile: zendure_solarflow_4000_mix_ac
      mode: live
      enabled: false
      max_output_power_w: 3000
      attributes:
        vendor: zendure
        host: "192.168.178.190"
        port: 80
        serial_number: "HEE3NDP5P200169"
        allow_control: false
        expected_model: "solarFlow4000MixAC+"
        supported_firmware_versions: [ "4144" ]

    - id: anker_live
      profile: anker_solarbank_max_ac
      mode: live
      enabled: false
      max_output_power_w: 800
      attributes:
        vendor: anker
        host: "<anker-ip>"
        port: 502
        allow_control: false
        expected_model: "<reported-product-code>"
        supported_firmware_versions: [ "<exact-verified-firmware-revision>" ]

    - id: marstek_live
      profile: marstek_venus_e_3_5120
      mode: live
      enabled: false
      max_output_power_w: 800
      attributes:
        vendor: marstek
        host: "<marstek-ip>"
        port: 30000
        allow_control: false
        expected_model: "<reported-model>"
        supported_firmware_versions: [ "<exact-verified-firmware-token>" ]
