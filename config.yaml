# Home Energy Monitoring configuration

collection:
  # Timezone used for all collected measurements.
  timezone: Europe/Berlin


collectors:

  # electricity meter for grid import/export
  # DLMS - faster - 1s intervals no problem
  - type: landys_gyr_zmd310_meter_dlms
    enabled: true
    interval: 1
    attributes:
      port: /dev/ttyUSB0
      source: meter_grid_dlms

  # IEC - slower - 6 s intervals max
  - type: landys_gyr_zmd310_meter_iec
    enabled: false
    interval: 10
    attributes:
      port: /dev/ttyUSB0
      source: meter_grid_iec

  # electricity meter for household consumption
  # DLMS - faster - 1s intervals no problem
  - type: landys_gyr_zmd310_meter_dlms
    enabled: true
    interval: 1
    attributes:
      port: /dev/ttyUSB1
      source: meter_household_dlms

  # IEC - slower - 6 s intervals max
  - type: landys_gyr_zmd310_meter_iec
    enabled: false
    interval: 10
    attributes:
      port: /dev/ttyUSB1
      source: meter_household_iec

  # Fronius Symo inverter
  - type: fronius
    enabled: true
    interval: 10
    attributes:
      source: inverter_fronius
      inverter_ip: 192.168.178.25
      latitude: 52.4
      longitude: 13.7

  # Rademacher environment sensor
  - type: environment
    enabled: true
    interval: 60
    attributes:
      source: sensor_rademacher
      smart_home_box_ip: 192.168.178.19
      device_id: 50

  # Open-Meteo weather forecast
  - type: weather
    enabled: false
    interval: 3600
    attributes:
      source: online_open_meteo
      latitude: 52.4
      longitude: 13.7

  # Shelly

  # Shelly Plug PM Gen3: SPM01 - SPM02
  - type: shelly_pm
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_pm_washer
      ip: 192.168.178.201

  - type: shelly_pm
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_pm_dryer
      ip: 192.168.178.200

  # Shelly Outdoor Plug S Gen3: SPO03 - SPO04
  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_outdoor_plug_lawnmower
      ip: 192.168.178.203

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_outdoor_plug
      ip: 192.168.178.204


  # Shelly Plug M Gen3: SP-05 - SP-16
  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_refrigirator
      ip: 192.168.178.205

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_dishwasher
      ip: 192.168.178.206

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_zehnder
      ip: 192.168.178.207

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_server
      ip: 192.168.178.208

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_felix
      ip: 192.168.178.209

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_tenways
      ip: 192.168.178.210

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_az_k
      ip: 192.168.178.211

  - type: shelly_switch
    enabled: true
    interval: 10
    attributes:
      source: shelly_plug_m_az_h
      ip: 192.168.178.212

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp13
      ip: 192.168.178.213

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp14
      ip: 192.168.178.214

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp15
      ip: 192.168.178.215

  - type: shelly_switch
    enabled: false
    interval: 10
    attributes:
      source: shelly_plug_m_sp16
      ip: 192.168.178.216

databases:
  # InfluxDB instance used to store measurements
  - type: influxdb
    enabled: false
    attributes:
      url: http://influxdb:8086
      org: home-energy
      bucket: energy

  - type: text_file
    enabled: true
    attributes:
      directory: ./data/backup

storage:
  measurements:
    meter_grid_dlms:
      - grid_import_energy_total
      - grid_export_energy_total
      - grid_active_power

    meter_household_dlms:
      - grid_import_energy_total
      - grid_export_energy_total
      - grid_active_power

    inverter_fronius:
      - pv_power
      - pv_energy_day
      - pv_energy_year
      - pv_energy_total
      # - ac_power
      - ac_energy_total
      - mppt_1_energy_total
      - mppt_2_energy_total

    sensor_rademacher:
      - temperature
      - light
      - wind_speed
      - rain_detected

    online_open_meteo:
      current:
        - temperature
        - cloud_cover
        - shortwave_radiation

      forecast:
        - temperature
        - precipitation_probability
        - cloud_cover

    shelly_plug_pm_washer:
      - power

    shelly_plug_pm_dryer:
      - power

    shelly_outdoor_plug_lawnmower:
      - power

    shelly_plug_m_refrigirator:
      - power

    shelly_plug_m_dishwasher:
      - power

    shelly_plug_m_zehnder:
      - power

    shelly_plug_m_server:
      - power

    shelly_plug_m_tenways:
      - power

    shelly_plug_m_az_k:
      - power

    shelly_plug_m_az_h:
      - power

    calculated:
      - inverter_efficiency
      - heat_pump_power
      # - household_power_draw



estimators:
  - type: kalman
    enabled: true
    lookback: 2

calculators:
  - type: formula
    enabled: true

    calculations:
      - source: calculated
        metric: heat_pump_power
        unit: kW
        formula: "grid_power - household_power"

        inputs:
          grid_power:
            source: meter_grid_dlms
            metric: grid_active_power
          household_power:
            source: meter_household_dlms
            metric: grid_active_power

      - source: calculated
        metric: household_power_draw
        unit: kW
        formula: "household_power + pv_power"
        inputs:
          pv_power:
            source: inverter_fronius
            metric: pv_power
          household_power:
            source: meter_household_dlms
            metric: grid_active_power

      - source: calculated
        metric: inverter_efficiency
        unit: "%"
        formula: "ac / (dc1 + dc2) * 100"

        inputs:
          ac:
            source: inverter_fronius
            metric: ac_power
          dc1:
            source: inverter_fronius
            metric: mppt_1_power
          dc2:
            source: inverter_fronius
            metric: mppt_2_power
