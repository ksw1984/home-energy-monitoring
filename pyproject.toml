[tool.poetry]
name = "home-energy-monitoring"
version = "0.1.0"
description = "Home energy monitoring using Gurux, smart meters and PV inverters"
authors = ["ksw1984"]
readme = "README.md"
packages = [
    { include = "*", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
gurux-common = "1.0.13"
gurux-dlms = "1.0.201"
gurux-serial = "1.0.21"
pyserial = "3.5"
requests = "^2.34.2"
influxdb-client = "^1.50.0"
dotenv = "^0.9.9"
astral = "^3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = "^26.5.0"
ruff = "^0.15.0"
mypy = "^1.17.0"
types-pyserial = "^3.5.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
home-energy-monitoring = "app:main"